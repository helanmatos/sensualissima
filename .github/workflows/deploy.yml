name: Deploy Sensualissima → GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ecommerce/package-lock.json

      - name: Instalar dependências
        run: npm ci
        working-directory: ecommerce

      - name: Build estático
        run: npm run build
        working-directory: ecommerce
        env:
          NODE_ENV: production

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ecommerce/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
